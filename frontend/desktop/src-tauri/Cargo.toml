[package]
name = "everyai-creatorstudio-desktop"
version = "0.1.0"
description = "Tauri v2 native desktop shell for EveryAI CreatorStudio"
edition = "2021"

[lib]
name = "creatorstudio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
